<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  .scent-wrapper {
    width: 100%;
    padding: 2rem 1rem 1.5rem;
    font-family: 'Manrope', sans-serif;
  }

  .circles-outer {
    width: 100%;
    max-width: 390px;
    margin: 0 auto;
  }

  .circles-container {
    position: relative;
    width: 100%;
    padding-bottom: 80.77%;
  }

  .circle {
    position: absolute;
    width: 51.28%;
    padding-bottom: 51.28%;
    border-radius: 50%;
  }

  .circle-top   { top: 0;      left: 24.36%; z-index: 3; }
  .circle-heart { top: 36.51%; left: 0;      z-index: 1; }
  .circle-base  { top: 36.51%; left: 48.72%; z-index: 1; }

  .circle-inner {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .circle.flipped .circle-inner { transform: rotateY(180deg); }

  .circle-front, .circle-back {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8%;
  }

  .circle-back { transform: rotateY(180deg); }

  .circle-top .circle-front, .circle-top .circle-back {
    background: rgba(220, 195, 80, 0.52);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 0.5px solid rgba(200, 170, 50, 0.65);
  }
  .circle-heart .circle-front, .circle-heart .circle-back {
    background: rgba(100, 120, 95, 0.52);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 0.5px solid rgba(80, 100, 75, 0.65);
  }
  .circle-base .circle-front, .circle-base .circle-back {
    background: rgba(160, 100, 55, 0.52);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 0.5px solid rgba(135, 80, 35, 0.65);
  }

  .adj-label {
    font-family: 'Manrope', sans-serif;
    font-size: clamp(11px, 3.8vw, 18px);
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .circle-top   .adj-label { color: #3a2e00; }
  .circle-heart .adj-label { color: #1a2415; }
  .circle-base  .adj-label { color: #2e1500; }

  .note-type {
    font-family: 'Manrope', sans-serif;
    font-size: clamp(7px, 2vw, 9px);
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 5px;
    opacity: 0.6;
  }
  .circle-top   .note-type { color: #3a2e00; }
  .circle-heart .note-type { color: #1a2415; }
  .circle-base  .note-type { color: #2e1500; }

  .note-names {
    font-family: 'Manrope', sans-serif;
    font-size: clamp(8px, 2.4vw, 11px);
    font-weight: 400;
    line-height: 1.6;
    text-align: center;
  }
  .circle-top   .note-names { color: #3a2e00; }
  .circle-heart .note-names { color: #1a2415; }
  .circle-base  .note-names { color: #2e1500; }

  .progress-bar-track {
    width: 100%;
    max-width: 390px;
    height: 2px;
    background: #ddd;
    border-radius: 2px;
    margin: 1.75rem auto 0;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: rgba(135, 80, 35, 0.65);
    border-radius: 2px;
    transition: width 0.1s linear;
  }
</style>

<div class="scent-wrapper">
  <div class="circles-outer">
    <div class="circles-container">

      <div class="circle circle-top" id="c-top">
        <div class="circle-inner">
          <div class="circle-front"><span class="adj-label">Invigorating</span></div>
          <div class="circle-back">
            <span class="note-type">Top note</span>
            <span class="note-names">Black Lemon<br>Lemon Heart<br>Turmeric Leaf</span>
          </div>
        </div>
      </div>

      <div class="circle circle-heart" id="c-heart">
        <div class="circle-inner">
          <div class="circle-front"><span class="adj-label">Uplifting</span></div>
          <div class="circle-back">
            <span class="note-type">Heart note</span>
            <span class="note-names">Patchouli<br>Mineral Moss<br>Sandalwood</span>
          </div>
        </div>
      </div>

      <div class="circle circle-base" id="c-base">
        <div class="circle-inner">
          <div class="circle-front"><span class="adj-label">Lionhearted</span></div>
          <div class="circle-back">
            <span class="note-type">Base note</span>
            <span class="note-names">Vetiver<br>Saffiano Leather<br>Vanilla Bean</span>
          </div>
        </div>
      </div>

    </div>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progress"></div>
    </div>
  </div>
</div>

<script>
  var LOOP = 8000;
  var FLIP_AT = 2000;
  var UNFLIP_AT = 6000;
  var ids = ['c-top', 'c-heart', 'c-base'];
  var startTime = null;

  function flip() { ids.forEach(function(id) { document.getElementById(id).classList.add('flipped'); }); }
  function unflip() { ids.forEach(function(id) { document.getElementById(id).classList.remove('flipped'); }); }

  function scheduleFlip() { setTimeout(flip, FLIP_AT); }
  function scheduleUnflip() {
    setTimeout(function() {
      unflip();
      setTimeout(function() {
        startTime = performance.now();
        scheduleFlip();
        scheduleUnflip();
      }, LOOP - UNFLIP_AT);
    }, UNFLIP_AT);
  }

  function tick(now) {
    var elapsed = (now - startTime);
    var pct = Math.min((elapsed / LOOP) * 100, 100);
    document.getElementById('progress').style.width = pct + '%';
    requestAnimationFrame(tick);
  }

  startTime = performance.now();
  scheduleFlip();
  scheduleUnflip();
  requestAnimationFrame(tick);
</script>
